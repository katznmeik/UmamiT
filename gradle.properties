# App version: the single source (06 §6). The versionCode is derived from it in
# build-logic (VersionCode.kt): MAJOR*1_000_000 + MINOR*10_000 + PATCH*100 + N.
umamit.version=0.2.1

org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.installations.auto-download=false

# Retry transient repository errors (e.g. HTTP 429 from Maven Central) more
# often than Gradle's default of 3 attempts (exponential backoff from 1 s).
# Note: with the configuration cache on, a resolution failure can be replayed
# from the cache entry, so it stays off here (decided again in M1-02).
systemProp.org.gradle.internal.network.retry.max.attempts=8
systemProp.org.gradle.internal.network.retry.initial.backOff=1000

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
