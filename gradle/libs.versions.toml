# Single source of truth for library and plugin versions (06 §1, §4).
# Latest mutually compatible stable versions at project start (2026-10-22).
# M1-01 pins everything later tasks need, so they never edit this file.
#
# compileSdk is pinned to 36 (06 §1, D-023). Newer releases of these libraries
# require compileSdk 37 in their AAR metadata, so the newest versions that still
# compile against 36 are used: core 1.18 (not 1.19), lifecycle 2.10, navigation
# 2.9, Compose BOM 2026.06.01 (UI 1.11), material3-adaptive 1.2, androidx.hilt
# 1.3, OkHttp 5.4, Coil 3.5, Vico 3.2, markdown renderer 0.41, AboutLibraries 14.2.
# Raising compileSdk is a deliberate decision; then update these together.

[versions]
# Build
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
buildTools = "36.1.0"

# Android SDK (D-023)
minSdk = "35"
targetSdk = "36"
compileSdk = "36"

# AndroidX / UI
androidxCore = "1.18.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.10.0"
androidxNavigation = "2.9.8"
composeBom = "2026.06.01"
material3Adaptive = "1.2.0"
androidxHilt = "1.3.0"
room = "2.8.5"
datastore = "1.3.0"
work = "2.12.0"

# DI
hilt = "2.60.1"

# Kotlin libraries
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.12.0"
javaxInject = "1"

# Network / parsing / images / charts / markdown / licences
okhttp = "5.4.0"
jsoup = "1.23.2"
coil = "3.5.0"
vico = "3.2.3"
markdownRenderer = "0.41.0"
aboutLibraries = "14.2.1"

# Debug
leakcanary = "2.14"

# Testing
junit4 = "4.13.2"
turbine = "1.2.1"
truth = "1.4.5"
robolectric = "4.17"
roborazzi = "1.77.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestExtJunit = "1.3.0"
espresso = "3.7.0"
uiautomator = "2.4.0"

# Quality tooling (configured in M1-02)
spotless = "8.10.4"
ktlint = "1.8.0"
detekt = "1.23.8"
composeRulesDetekt = "0.6.8"
kover = "0.9.11"

[libraries]
# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidxLifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "androidxNavigation" }

# Compose (versions from the BOM)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-animation = { module = "androidx.compose.animation:animation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
androidx-compose-material3-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "material3Adaptive" }
androidx-compose-material3-adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "material3Adaptive" }
androidx-compose-material3-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }

# DI
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
hilt-core = { module = "com.google.dagger:hilt-core", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
