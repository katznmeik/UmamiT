# Release workflow (06 §6, §6.1; M1-03, D-035, D-039, D-070; docs/release.md).
# Builds a signed release APK from `ref`, verifies it against the committed
# certificate fingerprint and publishes tag `v<version>` + GitHub Release.
# Dispatched by Claude only. GitHub dispatches it only while a file of this
# name is on `main`; the version at the dispatched workflow ref runs (D-039).
#
# Two jobs, so the signing key and the write token never meet (D-070):
# - `build` holds the keystore with a read-only token. It releases only a
#   commit whose CI (ci.yml) passed, repeats the schema checks, builds, signs
#   and verifies the APK, and hands it on as an artifact. It runs only
#   GitHub's own actions, pinned to commit SHAs, and no Gradle setup action
#   (one would inject init scripts into the signing build).
# - `publish` has `contents: write` and runs no action at all: it downloads
#   the artifact with `gh`, verifies it again and creates tag and release.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to build (e.g. claude/umamit-m1-start-k0jg3n or main)"
        required: true
        type: string
      version:
        description: "Version to release; must equal umamit.version in gradle.properties at ref (e.g. 0.0.1-probe, 0.1.0-rc.1, 0.1.0)"
        required: true
        type: string

# Every job declares what it needs.
permissions: {}

# One release at a time; never cancel a running release half-way.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Plain console output keeps the logs readable for Claude.
  GRADLE_OPTS: -Dorg.gradle.console=plain

jobs:
  build:
    name: Check, build, sign and verify ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      # Reads the CI runs of the commit.
      actions: read
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      version-code: ${{ steps.apk.outputs.version-code }}
      apk-sha256: ${{ steps.apk.outputs.apk-sha256 }}
      cert-sha256: ${{ steps.apk.outputs.cert-sha256 }}
    env:
      # Inputs reach shell steps only through the environment (no ${{ }} in scripts).
      INPUT_REF: ${{ inputs.ref }}
      VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check version against gradle.properties
        id: meta
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-probe|-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Input version '$VERSION' is not X.Y.Z, X.Y.Z-rc.N or X.Y.Z-probe (06 §6)."
            exit 1
          fi
          props_version="$(sed -n 's/^umamit\.version=//p' gradle.properties | tr -d '[:space:]')"
          if [[ "$props_version" != "$VERSION" ]]; then
            echo "::error::Version mismatch: input version is '$VERSION' but gradle.properties at '$INPUT_REF' has umamit.version='$props_version'. Bump gradle.properties on that ref or dispatch with the matching version."
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          if [[ "$VERSION" == *-* ]]; then prerelease=true; else prerelease=false; fi
          {
            echo "sha=$sha"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "Building $VERSION from $INPUT_REF at $sha (pre-release: $prerelease)."

      - name: Check that tag and release do not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          existing="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")"
          if [[ -n "$existing" ]]; then
            echo "::error::Tag $tag already exists. Releases are immutable; bump umamit.version (e.g. next -rc.N or 0.0.N-probe) and dispatch again."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::A GitHub Release named $tag already exists (possibly a draft). Delete it or bump the version."
            exit 1
          fi
          echo "Tag $tag is free."

      # The full quality gate, the emulator job and the R8 build run in CI on
      # every push; a release is built only from a commit where they passed.
      - name: Check that CI passed on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$(gh api -X GET "repos/$GH_REPO/actions/runs" -f head_sha="$SHA" -f status=success -f per_page=100 \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | first | .html_url // empty')"
          if [[ -z "$run_url" ]]; then
            echo "::error::No successful CI run (ci.yml) for $SHA. Wait until CI on that commit has passed (rerun a flaky job if needed), then dispatch again."
            exit 1
          fi
          echo "CI passed on $SHA: $run_url"

      - name: Check signing secrets
        env:
          UMAMIT_KEYSTORE_B64: ${{ secrets.UMAMIT_KEYSTORE_B64 }}
          UMAMIT_KEYSTORE_PASSWORD: ${{ secrets.UMAMIT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${UMAMIT_KEYSTORE_B64:-}" ]]; then
            echo "::error::Repository secret UMAMIT_KEYSTORE_B64 is missing or empty (06 §6.1 step 4)."
            missing=1
          fi
          if [[ -z "${UMAMIT_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::Repository secret UMAMIT_KEYSTORE_PASSWORD is missing or empty (06 §6.1 step 4)."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then exit 1; fi
          echo "Both signing secrets are set."

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK platform 36 and build-tools 36.1.0
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          if [[ ! -x "$sdk/build-tools/36.1.0/apksigner" || ! -d "$sdk/platforms/android-36" ]]; then
            sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            (yes || true) | "$sdkmanager" --licenses >/dev/null
            "$sdkmanager" --install "platforms;android-36" "build-tools;36.1.0" >/dev/null
          fi
          echo "BUILD_TOOLS_DIR=$sdk/build-tools/36.1.0" >> "$GITHUB_ENV"
          "$sdk/build-tools/36.1.0/apksigner" --version

      - name: Read versionCode from the build
        run: |
          set -euo pipefail
          output="$(./gradlew -q :app:printReleaseVersion)"
          echo "$output"
          name="$(sed -n 's/^versionName=//p' <<< "$output")"
          code="$(sed -n 's/^versionCode=//p' <<< "$output")"
          if [[ "$name" != "$VERSION" || ! "$code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The build reports versionName='$name' versionCode='$code'; expected versionName '$VERSION'."
            exit 1
          fi
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # The same schema checks as ci.yml (05 §9, D-054). The build above
      # rewrote the exported schema JSON, so a difference means the commit
      # carries a stale schema, which a release tag would then freeze.
      - name: Committed database schema is up to date
        run: |
          set -euo pipefail
          git diff --exit-code core/database/schemas
          untracked="$(git ls-files --others --exclude-standard core/database/schemas)"
          if [[ -n "$untracked" ]]; then
            echo "::error::schema files not committed: $untracked"
            exit 1
          fi

      - name: Released database schemas are unchanged
        run: scripts/check-frozen-schemas.sh

      - name: Decode keystore into the runner temp directory
        env:
          UMAMIT_KEYSTORE_B64: ${{ secrets.UMAMIT_KEYSTORE_B64 }}
          UMAMIT_KEYSTORE_PASSWORD: ${{ secrets.UMAMIT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/umamit-release.p12"
          if ! printf '%s' "$UMAMIT_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$keystore" 2>/dev/null; then
            echo "::error::UMAMIT_KEYSTORE_B64 is not valid base64."
            exit 1
          fi
          chmod 600 "$keystore"
          if ! keytool -list -keystore "$keystore" -storetype PKCS12 \
              -storepass:env UMAMIT_KEYSTORE_PASSWORD -alias umamit >/dev/null 2>&1; then
            echo "::error::The keystore from UMAMIT_KEYSTORE_B64 cannot be opened with UMAMIT_KEYSTORE_PASSWORD, or it has no alias 'umamit'."
            exit 1
          fi
          echo "Keystore decoded (PKCS12, alias umamit)."

      - name: Build signed release APK
        env:
          UMAMIT_KEYSTORE_FILE: ${{ runner.temp }}/umamit-release.p12
          UMAMIT_KEYSTORE_PASSWORD: ${{ secrets.UMAMIT_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-build-cache assembleRelease

      - name: Delete keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/umamit-release.p12"
          # The Gradle daemon received the password in its environment.
          ./gradlew --stop >/dev/null 2>&1 || true

      - name: Verify signature, certificate fingerprint and version
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$apk" && -f app/build/outputs/apk/release/app-release-unsigned.apk ]]; then
            echo "::error::The release APK was built unsigned; the signing configuration did not apply."
            exit 1
          fi
          scripts/verify-release-apk.sh "$apk" "$VERSION" "$VERSION_CODE" signing/release-cert-sha256.txt

      - name: Stage the APK for publishing
        id: apk
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          apk="$dist/umamit-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          {
            echo "version-code=$VERSION_CODE"
            echo "apk-sha256=$(sha256sum "$apk" | cut -d' ' -f1)"
            echo "cert-sha256=$(tr -d ':[:space:]' < signing/release-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"

      # The APK is public once released, so the artifact holds nothing secret.
      - name: Hand the APK to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: ${{ runner.temp }}/dist/umamit-${{ inputs.version }}.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish v${{ inputs.version }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Creates the tag and the release.
      contents: write
      # Downloads the build job's artifact.
      actions: read
    env:
      INPUT_REF: ${{ inputs.ref }}
      VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.build.outputs.sha }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      VERSION_CODE: ${{ needs.build.outputs.version-code }}
      APK_SHA256: ${{ needs.build.outputs.apk-sha256 }}
    # No `uses:` in this job: it holds the write token.
    steps:
      - name: Download the APK
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          gh run download "$GITHUB_RUN_ID" --name release-apk --dir "$dist"
          apk="$dist/umamit-$VERSION.apk"
          if [[ ! -f "$apk" ]]; then
            echo "::error::The artifact release-apk has no umamit-$VERSION.apk."
            exit 1
          fi
          actual="$(sha256sum "$apk" | cut -d' ' -f1)"
          if [[ "$actual" != "$APK_SHA256" ]]; then
            echo "::error::The downloaded APK has SHA-256 $actual, but the build job verified $APK_SHA256."
            exit 1
          fi
          echo "APK=$apk" >> "$GITHUB_ENV"

      # Again, outside the job that held the key: the signer must be the
      # committed release certificate, read from the built commit.
      - name: Verify signature, certificate fingerprint and version again
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/check"
          mkdir -p "$check"
          for file in scripts/verify-release-apk.sh signing/release-cert-sha256.txt; do
            gh api -H "Accept: application/vnd.github.raw+json" "repos/$GH_REPO/contents/$file?ref=$SHA" \
              > "$check/$(basename "$file")"
          done
          sdk="${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          if [[ ! -x "$sdk/build-tools/36.1.0/apksigner" ]]; then
            sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            (yes || true) | "$sdkmanager" --licenses >/dev/null
            "$sdkmanager" --install "build-tools;36.1.0" >/dev/null
          fi
          BUILD_TOOLS_DIR="$sdk/build-tools/36.1.0" bash "$check/verify-release-apk.sh" \
            "$APK" "$VERSION" "$VERSION_CODE" "$check/release-cert-sha256.txt"
          echo "CERT_SHA256=$(tr -d ':[:space:]' < "$check/release-cert-sha256.txt" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Create tag and GitHub Release
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if [[ "$PRERELEASE" == "true" ]]; then
            kind="Pre-release for on-device testing (probe or release candidate)."
            flags=(--prerelease)
          else
            kind="Final release."
            flags=(--latest)
          fi
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<EOF
          UmamiT $VERSION. $kind

          | | |
          |---|---|
          | versionName | \`$VERSION\` |
          | versionCode | \`$VERSION_CODE\` |
          | Commit | $SHA (built from \`$INPUT_REF\`) |
          | Signing certificate SHA-256 | \`$CERT_SHA256\` |
          | APK SHA-256 | \`$APK_SHA256\` |

          CI passed on this commit, and the signing certificate was verified against \`signing/release-cert-sha256.txt\` before publishing. Workflow run: $RUN_URL
          EOF
          # Re-check right before publishing: gh would attach to an existing tag.
          existing="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")"
          if [[ -n "$existing" ]]; then
            echo "::error::Tag $tag appeared while this run was building; not publishing."
            exit 1
          fi
          gh release create "$tag" "$APK" \
            --target "$SHA" \
            --title "UmamiT $VERSION" \
            --notes-file "$notes" \
            "${flags[@]}"
          echo "Published $tag at $SHA."
          {
            echo "### UmamiT $VERSION"
            echo "- Tag: \`$tag\` at \`$SHA\`"
            echo "- versionCode: \`$VERSION_CODE\`"
            echo "- Pre-release: $PRERELEASE"
            echo "- APK: \`umamit-$VERSION.apk\` (SHA-256 \`$APK_SHA256\`)"
          } >> "$GITHUB_STEP_SUMMARY"
